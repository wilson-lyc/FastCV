<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>FastCV · 个人资料</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <div class="app-shell">
      <aside class="sidebar">
        <div class="profile-switcher">
          <div class="profile-select-row">
            <button class="profile-name-button" id="profile-switch-button" type="button" aria-label="切换版本">
              <span id="profile-name">我的基础档案</span>
            </button>
            <button class="icon-button" id="new-profile-button" type="button" data-tooltip="新建版本" aria-label="新建版本"><svg class="plus-icon" width="18" height="18" viewBox="0 0 48 48" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true"><path d="M24.0605 10L24.0239 38" stroke="#000000" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/><path d="M10 24L38 24" stroke="#000000" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/></svg></button>
          </div>
        </div>

        <nav class="section-nav" aria-label="资料区块">
          <button class="nav-item active" data-section="basics" type="button"><span>基本信息</span></button>
          <button class="nav-item" data-section="contact" type="button"><span>联系方式</span></button>
          <button class="nav-item" data-section="objective" type="button"><span>求职意向</span></button>
          <button class="nav-item" data-section="experience" type="button"><span>工作经历</span><b data-count="experience">0</b></button>
          <button class="nav-item" data-section="education" type="button"><span>教育经历</span><b data-count="education">0</b></button>
          <button class="nav-item" data-section="projects" type="button"><span>项目经历</span><b data-count="projects">0</b></button>
          <button class="nav-item" data-section="skills" type="button"><span>技能</span><b data-count="skills">0</b></button>
          <button class="nav-item" data-section="certifications" type="button"><span>证书</span><b data-count="certifications">0</b></button>
          <button class="nav-item" data-section="languages" type="button"><span>语言</span><b data-count="languages">0</b></button>
          <button class="nav-item" data-section="other" type="button"><span>其他经历</span><b data-count="other">0</b></button>
          <button class="nav-item" data-section="links" type="button"><span>公开链接</span><b data-count="links">0</b></button>
          <button class="nav-item" data-section="application" type="button"><span>申请信息</span></button>
        </nav>

        <div class="sidebar-footer">
          <div class="sidebar-actions" aria-label="资料操作">
            <button class="sidebar-action" id="export-button" type="button" data-tooltip="导出备份" aria-label="导出备份">
              <svg width="24" height="24" viewBox="0 0 48 48" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true"><path d="M6 24.0083V42H42V24" stroke="currentColor" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/><path d="M33 23L24 32L15 23" stroke="currentColor" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/><path d="M23.9917 6V32" stroke="currentColor" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/></svg>
            </button>
            <button class="sidebar-action" id="import-button" type="button" data-tooltip="导入备份" aria-label="导入备份">
              <svg width="24" height="24" viewBox="0 0 48 48" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true"><mask id="sidebar-import-icon-mask" maskUnits="userSpaceOnUse" x="0" y="0" width="48" height="48" style="mask-type: alpha"><path d="M48 0H0V48H48V0Z" fill="currentColor"/></mask><g mask="url(#sidebar-import-icon-mask)"><path d="M6 24.0083V42H42V24" stroke="currentColor" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/><path d="M33 15L24 6L15 15" stroke="currentColor" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/><path d="M23.9917 32V6" stroke="currentColor" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/></g></svg>
            </button>
            <button class="sidebar-action" id="settings-button" type="button" data-tooltip="设置" aria-label="设置">
              <svg width="24" height="24" viewBox="0 0 48 48" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true"><path d="M18.2838 43.1713C14.9327 42.1736 11.9498 40.3213 9.58787 37.867C10.469 36.8227 11 35.4734 11 34.0001C11 30.6864 8.31371 28.0001 5 28.0001C4.79955 28.0001 4.60139 28.01 4.40599 28.0292C4.13979 26.7277 4 25.3803 4 24.0001C4 21.9095 4.32077 19.8938 4.91579 17.9995C4.94381 17.9999 4.97188 18.0001 5 18.0001C8.31371 18.0001 11 15.3138 11 12.0001C11 11.0488 10.7786 10.1493 10.3846 9.35011C12.6975 7.1995 15.5205 5.59002 18.6521 4.72314C19.6444 6.66819 21.6667 8.00013 24 8.00013C26.3333 8.00013 28.3556 6.66819 29.3479 4.72314C32.4795 5.59002 35.3025 7.1995 37.6154 9.35011C37.2214 10.1493 37 11.0488 37 12.0001C37 15.3138 39.6863 18.0001 43 18.0001C43.0281 18.0001 43.0562 17.9999 43.0842 17.9995C43.6792 19.8938 44 21.9095 44 24.0001C44 25.3803 43.8602 26.7277 43.594 28.0292C43.3986 28.01 43.2005 28.0001 43 28.0001C39.6863 28.0001 37 30.6864 37 34.0001C37 35.4734 37.531 36.8227 38.4121 37.867C36.0502 40.3213 33.0673 42.1736 29.7162 43.1713C28.9428 40.752 26.676 39.0001 24 39.0001C21.324 39.0001 19.0572 40.752 18.2838 43.1713Z" fill="none" stroke="currentColor" stroke-width="4" stroke-linejoin="round"/><path d="M24 31C27.866 31 31 27.866 31 24C31 20.134 27.866 17 24 17C20.134 17 17 20.134 17 24C17 27.866 20.134 31 24 31Z" fill="none" stroke="currentColor" stroke-width="4" stroke-linejoin="round"/></svg>
            </button>
            <button class="sidebar-action storage-status" id="save-button" type="button" data-tooltip="立即保存" data-state="saved" aria-live="polite" aria-label="立即保存">
              <svg class="storage-icon storage-icon-save" width="24" height="24" viewBox="0 0 48 48" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true"><path d="M6 9C6 7.34315 7.34315 6 9 6H34.2814L42 13.2065V39C42 40.6569 40.6569 42 39 42H9C7.34315 42 6 40.6569 6 39V9Z" fill="none" stroke="currentColor" stroke-width="4" stroke-linejoin="round"/><path d="M24.0083 6L24 13.3846C24 13.7245 23.5523 14 23 14H15C14.4477 14 14 13.7245 14 13.3846L14 6" stroke="currentColor" stroke-width="4" stroke-linejoin="round"/><path d="M9 6H34.2814" stroke="currentColor" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/><path d="M14 26H34" stroke="currentColor" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/><path d="M14 34H24.0083" stroke="currentColor" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/></svg>
              <svg class="storage-icon storage-icon-saving" width="24" height="24" viewBox="0 0 48 48" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true"><path d="M4 24C4 35.0457 12.9543 44 24 44C35.0457 44 44 35.0457 44 24C44 12.9543 35.0457 4 24 4" stroke="currentColor" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/></svg>
              <svg class="storage-icon storage-icon-success" width="24" height="24" viewBox="0 0 48 48" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true"><path d="M43 11L16.875 37L5 25.1818" stroke="currentColor" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/></svg>
            </button>
          </div>
          <input id="import-file" type="file" accept="application/json,.json" hidden />
        </div>
      </aside>

      <main class="main-content">
        <div class="page-body" id="content-scroll">
          <div class="page-content">
          <section class="content-section active" id="section-basics" data-panel="basics">
            <div class="section-divider"><h2>基本信息</h2><span class="section-divider-line"></span></div>
            <div class="form-grid" id="basics-form"></div>
          </section>

          <section class="content-section" id="section-contact" data-panel="contact">
            <div class="section-divider"><h2>联系方式</h2><span class="section-divider-line"></span></div>
            <div class="form-grid" id="contact-form"></div>
          </section>

          <section class="content-section" id="section-objective" data-panel="objective">
            <div class="section-divider"><h2>求职意向</h2><span class="section-divider-line"></span></div>
            <div class="form-grid" id="objective-form"></div>
          </section>

          <section class="content-section" id="section-experience" data-panel="experience"><div class="section-divider"><h2>工作经历</h2><span class="section-divider-line"></span><button class="button button-primary add-button" data-add="experience" type="button">添加经历</button></div><div class="repeat-list" id="experience-list"></div></section>
          <section class="content-section" id="section-education" data-panel="education"><div class="section-divider"><h2>教育经历</h2><span class="section-divider-line"></span><button class="button button-primary add-button" data-add="education" type="button">添加教育经历</button></div><div class="repeat-list" id="education-list"></div></section>
          <section class="content-section" id="section-projects" data-panel="projects"><div class="section-divider"><h2>项目经历</h2><span class="section-divider-line"></span><button class="button button-primary add-button" data-add="projects" type="button">添加项目</button></div><div class="repeat-list" id="projects-list"></div></section>
          <section class="content-section" id="section-skills" data-panel="skills"><div class="section-divider"><h2>技能</h2><span class="section-divider-line"></span><button class="button button-primary add-button" data-add="skills" type="button">添加技能</button></div><div class="repeat-list" id="skills-list"></div></section>
          <section class="content-section" id="section-certifications" data-panel="certifications"><div class="section-divider"><h2>证书与资格</h2><span class="section-divider-line"></span><button class="button button-primary add-button" data-add="certifications" type="button">添加证书</button></div><div class="repeat-list" id="certifications-list"></div></section>
          <section class="content-section" id="section-languages" data-panel="languages"><div class="section-divider"><h2>语言能力</h2><span class="section-divider-line"></span><button class="button button-primary add-button" data-add="languages" type="button">添加语言</button></div><div class="repeat-list" id="languages-list"></div></section>
          <section class="content-section" id="section-other" data-panel="other"><div class="section-divider"><h2>其他经历</h2><span class="section-divider-line"></span></div><div class="subsection-block first-subsection"><h3>出版物</h3><div class="repeat-list" id="publications-list"></div><button class="button button-quiet add-button" data-add="publications" type="button">添加出版物</button></div><div class="subsection-block"><h3>奖项</h3><div class="repeat-list" id="awards-list"></div><button class="button button-quiet add-button" data-add="awards" type="button">添加奖项</button></div><div class="subsection-block"><div class="subsection-heading"><h3>志愿经历</h3><button class="button button-quiet add-button" data-add="volunteering" type="button">添加志愿经历</button></div><div class="repeat-list" id="volunteering-list"></div></div></section>
          <section class="content-section" id="section-links" data-panel="links"><div class="section-divider"><h2>公开链接</h2><span class="section-divider-line"></span><button class="button button-primary add-button" data-add="links" type="button">添加链接</button></div><div class="repeat-list" id="links-list"></div></section>

          <section class="content-section" id="section-application" data-panel="application">
            <div class="section-divider"><h2>申请信息</h2><span class="section-divider-line"></span></div>
            <div class="subsection-block"><h3>工作授权</h3><div class="form-grid" id="authorization-form"></div></div>
            <div class="subsection-block"><h3>到岗与薪资</h3><div class="form-grid" id="application-form"></div></div>
          </section>
          </div>
        </div>
      </main>
    </div>
    <div class="modal-backdrop" id="profile-list-modal" hidden>
      <section class="modal-card modal-card-list" role="dialog" aria-modal="true" aria-labelledby="profile-list-title">
        <div class="modal-header">
          <div>
            <h2 id="profile-list-title">版本管理</h2>
          </div>
          <button class="modal-close" type="button" data-modal-close="profile-list-modal" aria-label="关闭"><svg width="14" height="14" viewBox="0 0 48 48" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true"><path d="M8 8L40 40" stroke="#000000" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/><path d="M8 40L40 8" stroke="#000000" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/></svg></button>
        </div>
        <div class="profile-version-list" id="profile-version-list"></div>
      </section>
    </div>
    <div class="modal-backdrop" id="profile-editor-modal" hidden>
      <section class="modal-card modal-card-editor" role="dialog" aria-modal="true" aria-labelledby="profile-editor-title">
        <div class="modal-header">
          <div>
            <h2 id="profile-editor-title">新建版本</h2>
          </div>
          <button class="modal-close" type="button" data-modal-close="profile-editor-modal" aria-label="关闭"><svg width="14" height="14" viewBox="0 0 48 48" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true"><path d="M8 8L40 40" stroke="#000000" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/><path d="M8 40L40 8" stroke="#000000" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/></svg></button>
        </div>
        <form id="profile-editor-form">
          <label class="modal-field" for="profile-name-input">版本名称<input id="profile-name-input" type="text" maxlength="80" autocomplete="off" /></label>
          <div class="modal-actions">
            <button class="button button-quiet" type="button" data-modal-close="profile-editor-modal">取消</button>
            <button class="button button-primary" type="submit">保存</button>
          </div>
        </form>
      </section>
    </div>
    <div class="modal-backdrop" id="confirm-modal" hidden>
      <section class="modal-card confirm-card" role="dialog" aria-modal="true" aria-labelledby="confirm-title" aria-describedby="confirm-message">
        <div class="modal-header">
          <h2 id="confirm-title">确认操作</h2>
          <button class="modal-close" type="button" data-confirm-cancel aria-label="取消"><svg width="14" height="14" viewBox="0 0 48 48" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true"><path d="M8 8L40 40" stroke="#000000" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/><path d="M8 40L40 8" stroke="#000000" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/></svg></button>
        </div>
        <p class="confirm-message" id="confirm-message"></p>
        <div class="modal-actions">
          <button class="button button-quiet" type="button" data-confirm-cancel>取消</button>
          <button class="button button-primary" id="confirm-submit" type="button">确认</button>
        </div>
      </section>
    </div>
    <div class="toast" id="toast" role="status" aria-live="polite"></div>
    <script src="app.js"></script>
  </body>
</html>
