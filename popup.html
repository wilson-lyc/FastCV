<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>FastCV</title>
    <style>
      :root { color: #172124; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, "Noto Sans", sans-serif, "Apple Color Emoji", "Segoe UI Emoji", "Segoe UI Symbol", "Noto Color Emoji"; font-size: 16px; line-height: 1.5; }
      body { width: 260px; margin: 0; padding: 20px; background: #fafafa; }
      .brand { display: flex; align-items: center; gap: 10px; margin-bottom: 18px; }
      .mark { width: 32px; height: 32px; display: grid; place-items: center; border-radius: 8px; background: #111827; color: #fff; font-weight: 800; }
      strong { display: block; font-size: 18px; font-weight: 600; }
      small { display: block; margin-top: 3px; color: #738084; font-size: 12px; }
      p { margin: 0 0 17px; color: #64716f; font-size: 16px; line-height: 1.5; }
      button { width: 100%; height: 42px; border: 0; border-radius: 7px; background: #111827; color: #fff; font-size: 14px; font-weight: 500; cursor: pointer; }
      button:hover { background: #000; }
    </style>
  </head>
  <body>
    <div class="brand"><div class="mark">F</div><div><strong>FastCV</strong><small>Personal data workspace</small></div></div>
    <p>维护个人求职资料。所有字段均为可选，数据只保存在本地。</p>
    <button id="open-options" type="button">打开数据维护</button>
    <script src="popup.js"></script>
  </body>
</html>
